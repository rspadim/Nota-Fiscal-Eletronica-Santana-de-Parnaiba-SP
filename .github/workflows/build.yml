name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Executavel e instalador (Windows)
    runs-on: windows-latest
    permissions:
      contents: write   # necessario para anexar o instalador na release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Testes (antes de empacotar)
        run: python -m unittest discover -s tests -v

      - name: Gerar executavel
        run: pyinstaller nfse.spec --noconfirm

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Gerar instalador
        run: iscc installer.iss

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: nfse-santana-instalador
          path: dist/instalador/*.exe
          if-no-files-found: error

      - name: Publicar na release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/instalador/*.exe
          generate_release_notes: true
